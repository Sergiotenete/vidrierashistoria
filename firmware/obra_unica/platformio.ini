; Vidrieras Historia — instalación de una sola obra (100 x WS2812B + ESP32)
;
;   pio run -t upload      compila y graba
;   pio device monitor     consola serie (115200 baudios)

[env:esp32dev]
platform      = espressif32@^6.5.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    fastled/FastLED@^3.6.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
